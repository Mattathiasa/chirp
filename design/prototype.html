<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Chirp Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light;--ink:#0C0C14;--ink2:#1A1A26;--paper:#ECEDF4;--paper2:#DFE1EC;--white:#FBFBFE;--cobalt:#2A3BFF;--cobalt2:#1B27C9;--tang:#FF5A36;--butter:#FFD84A;--mint:#5EE2A4;--pink:#FF9EC7;--lilac:#C7B8FF;--mute:#5A5B6E;--rule:#C9CCDC;--red:#E5323B;
--display:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;--body:'Hanken Grotesk',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{height:100%}
:root{padding-block:0}
body{margin:0;background:var(--paper);color:var(--ink);font:500 16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--mono)}
.disp{font-family:var(--display);font-weight:800;letter-spacing:-.04em;line-height:.92}
.eyebrow{font:500 12.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center}
svg{display:block;flex:none}

/* ---------- prototype chrome ---------- */
#ground{height:100%;display:flex;align-items:center;justify-content:center;background:var(--paper);transition:background .3s}
#frame{container:frame/inline-size;width:100%;height:100%;position:relative;overflow:hidden;background:var(--paper)}
body.phone #ground{background:var(--cobalt);padding:16px}
body.phone #frame{width:410px;max-width:100%;height:min(880px,100%);border-radius:48px;border:10px solid var(--ink);box-shadow:0 14px 0 rgba(12,12,20,.35)}
.switch{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:100;display:flex;padding:4px;gap:2px;border-radius:999px;background:var(--ink);box-shadow:0 6px 0 rgba(12,12,20,.25)}
.switch button{height:34px;padding:0 14px;border-radius:999px;color:#C9CCDC;font:700 13px var(--body)}
.switch button[aria-pressed=true]{background:var(--butter);color:var(--ink)}
body.phone .switch{right:auto;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#toast{position:absolute;left:50%;top:18px;transform:translate(-50%,-140%);z-index:90;padding:12px 20px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px;transition:transform .25s;max-width:calc(100% - 32px);text-align:center}
#toast.on{transform:translate(-50%,0)}
#toast.bad{background:var(--red)}

/* ---------- buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 26px;border-radius:999px;font-weight:700;font-size:16px;white-space:nowrap;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(2px)}
.btn.ink{background:var(--ink);color:var(--paper)}
.btn.tang{background:var(--tang);color:var(--ink);box-shadow:0 5px 0 var(--ink)}
.btn.tang:active{box-shadow:0 2px 0 var(--ink)}
.btn.cobalt{background:var(--cobalt);color:#fff}
.btn.butter{background:var(--butter);color:var(--ink);box-shadow:0 5px 0 var(--ink)}
.btn.ghost{border:2px solid var(--ink)}
.btn.ghostw{border:2px solid var(--paper);color:var(--paper)}
.btn.soft{background:var(--paper2)}
.btn.red{background:var(--red);color:#fff}
.btn.sm{height:40px;padding:0 18px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.chip.ok{background:var(--mint);color:var(--ink)}
.chip.warn{background:var(--butter);color:var(--ink)}
.chip.bad{background:var(--red);color:#fff}
.chip.dim{background:var(--paper2);color:var(--mute)}
.chip.ink{background:var(--ink);color:var(--paper)}
.chip.road{background:transparent;border:1.5px dashed var(--mute);color:var(--mute)}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--paper2)}
.ib.dark{background:var(--ink);color:var(--paper)}
.av{position:relative;flex:none;display:inline-block}
.av>b{display:grid;place-items:center;width:100%;height:100%;font:800 1em var(--display);letter-spacing:-.02em}
.av>i{position:absolute;right:-3px;bottom:-3px;width:30%;min-width:12px;aspect-ratio:1;border-radius:50%;border:3px solid var(--paper);background:var(--mute)}
.av>i.on{background:var(--mint)}.av>i.wait{background:var(--butter)}

/* ---------- landing ---------- */
.landing{height:100%;overflow-y:auto;overflow-x:hidden;background:var(--paper);scroll-behavior:smooth}
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:32px;padding:18px 48px;background:var(--paper);border-bottom:2px solid var(--ink)}
.nav a{font-weight:700;font-size:15px;cursor:pointer}
.logo{display:flex;align-items:center;gap:10px;font:800 28px var(--display);letter-spacing:-.05em}
.logo span{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--tang)}
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr);gap:32px;padding:64px 48px 72px;align-items:center}
.hero h1{font:800 clamp(44px,8.6cqw,136px)/.88 var(--display);letter-spacing:-.05em;text-wrap:balance}
.hero h1 mark{background:var(--tang);color:var(--ink);padding:0 .12em;border-radius:.14em;display:inline-block;transform:rotate(-2deg)}
.hero p.lead{font-size:20px;line-height:1.45;max-width:34ch;margin:28px 0 32px;font-weight:500}
.stackcards{position:relative;height:600px}
.sc-phone{position:absolute;right:20px;top:0;width:300px;height:560px;border-radius:44px;background:var(--cobalt);border:6px solid var(--ink);padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:12px 14px 0 var(--ink);transform:rotate(3deg)}
.sc-phone .b{padding:10px 14px;border-radius:20px;font-size:14px;line-height:1.35;font-weight:600;max-width:82%}
.sc-phone .b.t{background:var(--white);color:var(--ink);align-self:flex-start;border-bottom-left-radius:5px}
.sc-phone .b.m{background:var(--butter);color:var(--ink);align-self:flex-end;border-bottom-right-radius:5px}
.float{position:absolute;padding:12px 16px;border-radius:20px;border:2px solid var(--ink);background:var(--white);box-shadow:6px 6px 0 var(--ink);font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px}
.marq{background:var(--ink);color:var(--butter);overflow:hidden;white-space:nowrap;padding:22px 0;border-block:2px solid var(--ink)}
.marq>div{display:inline-flex;gap:40px;animation:marq 38s linear infinite;font:800 34px var(--display);letter-spacing:-.03em;text-transform:uppercase}
.marq span.s{color:var(--tang)}
@keyframes marq{to{transform:translateX(-50%)}}
.sec{padding:96px 48px}
.sec h2{font:800 clamp(38px,6.2cqw,92px)/.92 var(--display);letter-spacing:-.045em;text-wrap:balance}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:56px}
.step{border:2px solid var(--ink);border-radius:32px;padding:32px;min-height:400px;display:flex;flex-direction:column;gap:14px;box-shadow:8px 8px 0 var(--ink)}
.step .n{font:800 128px/.8 var(--display);letter-spacing:-.06em;margin-bottom:auto}
.step h3{font:800 34px/1 var(--display);letter-spacing:-.04em}
.step p{font-size:16.5px;line-height:1.45}
.step code{font-family:var(--mono);font-size:13px;background:rgba(12,12,20,.12);padding:2px 7px;border-radius:6px}
.dark{background:var(--ink);color:var(--paper)}
.meshwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:48px;align-items:center}
.facts{display:flex;flex-direction:column;margin-top:36px}
.facts div{display:flex;gap:16px;padding:18px 0;border-top:1px solid #3A3B50;font-size:17px}
.facts b{font:800 30px/1 var(--display);letter-spacing:-.04em;color:var(--butter);min-width:110px}
.trustgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:48px}
.tcard{border:2px solid var(--ink);border-radius:32px;padding:28px;display:flex;flex-direction:column;gap:18px}
.fp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fp span{padding:8px 0;text-align:center;border-radius:9px;background:rgba(12,12,20,.09);font:500 15px var(--mono)}
.fp.d span{background:rgba(255,255,255,.22)}
.fp span.diff{background:var(--red);color:#fff}
table.cmp{width:100%;border-collapse:collapse;margin-top:48px;font-size:18px}
table.cmp th,table.cmp td{padding:20px 18px;text-align:left;border-bottom:2px solid var(--ink)}
table.cmp th{font:800 26px var(--display);letter-spacing:-.03em}
table.cmp td.y{background:var(--butter);font-weight:700}
.faq{margin-top:40px;border-top:2px solid var(--ink)}
.faq .q{border-bottom:2px solid var(--ink)}
.faq .q>button{width:100%;text-align:left;display:flex;align-items:center;gap:20px;padding:26px 4px;font:800 clamp(22px,2.6cqw,34px)/1.05 var(--display);letter-spacing:-.03em}
.faq .q>button svg{transition:transform .2s;margin-left:auto}
.faq .q.open>button svg{transform:rotate(45deg)}
.faq .a{display:none;padding:0 4px 28px;max-width:70ch;font-size:17.5px;line-height:1.55}
.faq .q.open .a{display:block}
.cta{background:var(--cobalt);color:#fff;padding:110px 48px;display:flex;flex-direction:column;gap:32px;align-items:flex-start}
.cta h2{font:800 clamp(44px,9cqw,150px)/.86 var(--display);letter-spacing:-.05em;max-width:12ch}
.code{font:500 15px var(--mono);background:var(--ink);color:var(--butter);padding:16px 22px;border-radius:16px}
.foot{display:flex;gap:24px;align-items:center;flex-wrap:wrap;padding:36px 48px;background:var(--ink);color:var(--paper);font-size:14px}

/* ---------- onboarding ---------- */
.ob{height:100%;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}
.ob-l{padding:44px 48px;display:flex;flex-direction:column;color:var(--ink);transition:background .35s}
.ob-l .big{font:800 clamp(140px,22cqw,340px)/.8 var(--display);letter-spacing:-.07em;margin-top:auto}
.ob-r{padding:44px 64px;display:flex;flex-direction:column;justify-content:center;gap:24px;overflow-y:auto;background:var(--paper)}
.ob-r h1{font:800 clamp(38px,5cqw,76px)/.92 var(--display);letter-spacing:-.045em;text-wrap:balance}
.ob-r p.sub{font-size:18px;line-height:1.5;max-width:46ch}
.dots{display:flex;gap:8px}.dots i{height:8px;flex:1;max-width:56px;border-radius:4px;background:rgba(12,12,20,.2)}.dots i.on{background:var(--ink)}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font:500 12.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.field input{height:64px;padding:0 22px;border:2px solid var(--ink);border-radius:18px;background:var(--white);font:700 24px var(--display);letter-spacing:-.02em}
.field input.pw{font:500 17px var(--body);height:56px}
.field input:focus{outline:0;box-shadow:0 5px 0 var(--cobalt);border-color:var(--cobalt)}
.term{background:var(--ink);color:var(--butter);border-radius:20px;padding:20px 22px;font:500 14px/1.9 var(--mono);min-height:168px}
.term .ok{color:var(--mint)}
.bars{display:flex;gap:6px}.bars i{flex:1;height:8px;border-radius:4px;background:var(--rule)}
.toggle{display:flex;align-items:center;gap:16px;padding:18px 0;border-bottom:2px solid var(--ink)}
.toggle .t{font-weight:700;font-size:17px}.toggle .n{font-size:14px;color:var(--mute)}
.sw{position:relative;width:60px;height:34px;border-radius:17px;background:var(--rule);flex:none;border:2px solid var(--ink);transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:var(--ink);transition:transform .15s}
.sw[aria-checked=true]{background:var(--mint)}.sw[aria-checked=true]::after{transform:translateX(26px)}
.sw[disabled]{opacity:.55}

/* ---------- app shell ---------- */
.app{height:100%;display:grid;grid-template-columns:88px 392px minmax(0,1fr);background:var(--paper)}
.app.p{grid-template-columns:88px 392px minmax(0,1fr) 360px}
.app.wide{grid-template-columns:88px minmax(0,1fr)}
.rail{background:var(--ink);display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 0}
.rail .lg{width:46px;height:46px;border-radius:15px;background:var(--tang);display:grid;place-items:center;margin-bottom:14px}
.rb{position:relative;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:#A9ABC4}
.rb:hover{color:#fff;background:var(--ink2)}
.rb[aria-current=true]{background:var(--butter);color:var(--ink)}
.rb em{position:absolute;top:4px;right:2px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--tang);color:var(--ink);font:800 11px/20px var(--body);text-align:center;font-style:normal;border:2px solid var(--ink)}
.rail .sp{flex:1}
.pane-l{display:flex;flex-direction:column;min-height:0;border-right:2px solid var(--ink)}
.ph{padding:26px 24px 12px;display:flex;flex-direction:column;gap:16px}
.ph h1{font:800 56px/.9 var(--display);letter-spacing:-.05em}
.search{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border:2px solid var(--ink);border-radius:16px;background:var(--white);color:var(--mute);width:100%;text-align:left;font-weight:600}
.strip{display:flex;gap:14px;padding:6px 24px 14px;overflow-x:auto}
.strip button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;flex:none}
.list{flex:1;overflow-y:auto;padding:4px 12px 20px}
.sect{padding:16px 12px 8px;display:flex;align-items:center;gap:8px;font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.item{display:flex;align-items:center;gap:14px;width:100%;padding:12px;border-radius:20px;text-align:left;border:2px solid transparent}
.item:hover{background:var(--paper2)}
.item[aria-current=true]{background:var(--white);border-color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.item .nm{font:800 18px var(--display);letter-spacing:-.03em;display:flex;align-items:center;gap:6px}
.item .pv{font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.item .pv.w{color:#8A5A00;font-weight:700}
.item .mt{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font:500 11.5px var(--mono);color:var(--mute)}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--cobalt);color:#fff;font:800 12px/22px var(--body);text-align:center}
.thread{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--white)}
.th{display:flex;align-items:center;gap:14px;padding:16px 24px;border-bottom:2px solid var(--ink);background:var(--paper)}
.th h2{font:800 28px/1 var(--display);letter-spacing:-.04em}
.th .st{font:500 12.5px var(--mono);color:var(--mute);margin-top:4px}
.th .st.on{color:#0B7A4B;font-weight:500}
.back{display:none}
.banner{display:flex;gap:14px;align-items:center;padding:14px 24px;border-bottom:2px solid var(--ink);font-size:15px;font-weight:600}
.banner.bad{background:var(--red);color:#fff}.banner.warn{background:var(--butter)}.banner.info{background:var(--lilac)}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:24px 32px 12px;display:flex;flex-direction:column;gap:8px}
.day{align-self:center;font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:6px 14px;border-radius:999px;background:var(--paper)}
.m{display:flex;flex-direction:column;gap:4px;max-width:min(560px,78%)}
.m.me{align-self:flex-end;align-items:flex-end}.m.th2{align-self:flex-start}
.bub{padding:12px 18px;border-radius:24px;font-size:16.5px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:500}
.m.me .bub{background:var(--cobalt);color:#fff;border-bottom-right-radius:6px}
.m.th2 .bub{background:var(--white);border:2px solid var(--ink);border-bottom-left-radius:6px}
.who{font:800 13px var(--display);letter-spacing:-.01em;padding-left:6px}
.stat{display:flex;align-items:center;gap:5px;font:500 11.5px var(--mono);color:var(--mute);padding:0 6px}
.stat.q{background:var(--butter);color:var(--ink);border-radius:999px;padding:3px 10px 3px 8px;font-weight:500}
.stat.ok{color:#0B7A4B}
.photo{width:260px;height:180px;border-radius:24px;border:2px solid var(--ink);position:relative;overflow:hidden;background:var(--butter)}
.filec{display:flex;align-items:center;gap:14px;padding:14px 18px;border:2px solid var(--ink);border-radius:20px;background:var(--white);min-width:260px}
.typing{display:inline-flex;gap:4px;padding:14px 18px;border-radius:24px;background:var(--paper);border:2px solid var(--ink);border-bottom-left-radius:6px;align-self:flex-start}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink);animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.reacts{display:flex;gap:6px;flex-wrap:wrap;padding-left:4px}
.reacts button{height:26px;padding:0 10px;border-radius:999px;border:1.5px solid var(--ink);background:var(--white);font:700 12px var(--body)}
.reacts button.me{background:var(--butter)}
.composer{display:flex;align-items:flex-end;gap:10px;margin:8px 20px 20px;padding:8px 8px 8px 12px;border:2px solid var(--ink);border-radius:30px;background:var(--white)}
.composer:focus-within{box-shadow:0 5px 0 var(--cobalt);border-color:var(--cobalt)}
.composer textarea{flex:1;min-width:0;border:0;outline:0;resize:none;background:transparent;padding:11px 4px;max-height:140px;line-height:22px;font-size:16.5px}
.composer textarea:disabled{color:var(--mute)}
.send{width:48px;height:48px;border-radius:50%;background:var(--tang);color:var(--ink);display:grid;place-items:center;flex:none;border:2px solid var(--ink)}
.send:disabled{background:var(--paper2);border-color:var(--rule);color:var(--mute);cursor:not-allowed}
.panel{background:var(--butter);border-left:2px solid var(--ink);overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:18px;min-height:0}
.panel.bad{background:var(--tang)}
.panel h3{font:800 34px/.95 var(--display);letter-spacing:-.045em}
.pcard{background:var(--white);border:2px solid var(--ink);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.pcard h4{margin:0;font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.words{display:flex;flex-wrap:wrap;gap:8px}.words span{padding:7px 13px;border-radius:12px;background:var(--butter);border:2px solid var(--ink);font-weight:800;font-family:var(--display);font-size:16px}
.tabs2{display:flex;gap:6px;padding:5px;border:2px solid var(--ink);border-radius:999px;background:var(--white)}
.tabs2 button{flex:1;height:36px;border-radius:999px;font-weight:700;font-size:13.5px}
.tabs2 button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.media{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.media div{aspect-ratio:1;border-radius:16px;border:2px solid var(--ink);position:relative;overflow:hidden}
.mtabbar{display:none}

/* pages */
.page{overflow-y:auto;padding:32px 48px 56px;background:var(--paper);display:flex;flex-direction:column;gap:28px;min-height:0}
.page>h1{font:800 clamp(52px,7cqw,104px)/.88 var(--display);letter-spacing:-.05em}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tile{border:2px solid var(--ink);border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:6px;box-shadow:6px 6px 0 var(--ink)}
.tile b{font:800 64px/.9 var(--display);letter-spacing:-.05em}
.tile span{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.card{border:2px solid var(--ink);border-radius:28px;padding:24px;background:var(--white);display:flex;flex-direction:column;gap:14px}
.card h3{font:800 26px/1 var(--display);letter-spacing:-.04em}

 else if(k==='identity'){var fp=fpOf(S.name||'You');h='<div class="row" style="justify-content:space-between"><h2>My fingerprint.</h2><button class="ib" data-a="closem" aria-label="Close">'+I('x',22)+'</button></div><div class="row" style="gap:14px">'+identicon(S.name||'You',72,'var(--butter)','var(--ink)')+'<div class="disp" style="font-size:28px">'+esc(S.name||'You')+'</div></div><div class="pcard"><h4>Fingerprint</h4><div class="fp">'+fp.map(function(x){return '<span>'+x+'</span>'}).join('')+'</div></div><div class="pcard"><h4>My words</h4><div class="words">'+wordsOf(S.name||'You').map(function(x){return '<span>'+x+'</span>'}).join('')+'</div></div><button class="btn ink" data-a="copyfp">'+I('copy',18)+'Copy full fingerprint</button>'}

   if(!(S.view==='app'&&S.tab==='chats'&&S.cur===pid&&!(S.phone&&S.m!=='thread')))unread[pid]=(unread[pid]||0)+1;
   if(S.view==='app')render({bottom:true,nofocus:1})},1300)},700)}
